# Watches zed-industries/zed for new stable releases and, when one appears that
# the fork hasn't integrated yet, opens a single PR to merge it into the fork's
# branch (mvp-fork-dist). You review and merge it (resolving conflicts in the
# GitHub UI or locally if any).
#
# Idempotent: does nothing (silently) if the release is already integrated or a
# sync PR for it is already open, so it won't spam PRs or emails.
#
# NOTE: scheduled workflows only run from the repository's DEFAULT branch, so
# mvp-fork-dist must stay as the fork's default branch.
name: Sync Upstream Release

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-fork-dist
          fetch-depth: 0

      - name: Add upstream and fetch tags
        run: |
          git remote add upstream https://github.com/zed-industries/zed.git
          # Force-update tags: the fork already carries all of upstream's tags,
          # so a plain fetch would be rejected for "would clobber existing tag".
          git fetch --quiet --force upstream 'refs/tags/*:refs/tags/*'

      - name: Determine latest upstream stable release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh api repos/zed-industries/zed/releases/latest --jq .tag_name)"
          # Upstream keeps a branch per release line (v1.13.2 lives on v1.13.x),
          # and the PR is opened straight from it — see the note below.
          RELEASE_BRANCH="${TAG%.*}.x"
          echo "Latest upstream stable: $TAG (branch $RELEASE_BRANCH)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Decide whether a sync is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if git merge-base --is-ancestor "refs/tags/$TAG" HEAD; then
            echo "Already integrated; nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          elif gh pr list --repo "$GITHUB_REPOSITORY" --state open \
                 --search "Sync upstream $TAG in:title" --json number --jq 'length' \
               | grep -qv '^0$'; then
            echo "A sync PR for $TAG is already open; nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open sync PR
        if: steps.check.outputs.needed == 'true'
        env:
          # Opening a PR whose head lives in zed-industries/zed needs a token
          # with access to BOTH repositories; GITHUB_TOKEN is scoped to this one
          # and the call comes back "Resource not accessible by integration".
          # Set a SYNC_PAT secret (a classic PAT with public_repo is enough) to
          # let the schedule open the PR unattended. Without it the step still
          # runs and fails loudly, which is the signal to open the PR by hand.
          GH_TOKEN: ${{ secrets.SYNC_PAT || github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          RELEASE_BRANCH="${{ steps.tag.outputs.release_branch }}"
          # Open the PR directly from upstream's own release branch rather than
          # copying it into this fork first. Pushing it here would carry
          # upstream's .github/workflows/ files, and GITHUB_TOKEN is not allowed
          # to create or update workflow files — that rejection ("`workflows`
          # scope may be required") failed this job every Monday. A cross-fork
          # PR needs no push at all, so no elevated token is needed.
          # Conflicts, if any, surface on the PR for you to resolve.
          #
          # Called through the API rather than `gh pr create` because that helper
          # always asks for maintainer_can_modify, which cannot be granted on a
          # head branch living in a repository we do not control, and the call
          # fails outright ("Fork collab can't be granted by someone without
          # permission").
          gh api "repos/$GITHUB_REPOSITORY/pulls" -X POST \
            -f title="Sync upstream $TAG" \
            -f head="zed-industries:$RELEASE_BRANCH" \
            -f base="mvp-fork-dist" \
            -F maintainer_can_modify=false \
            -f body="Brings in upstream Zed \`$TAG\` from the \`$RELEASE_BRANCH\` release branch. Review, resolve any conflicts, and merge; then cut a \`fork-v*\` tag to publish a build." \
            --jq .html_url
