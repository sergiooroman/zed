# Watches zed-industries/zed for new stable releases and, when one appears that
# the fork hasn't integrated yet, opens a single PR to merge it into the fork's
# branch (mvp-fork-dist). You review and merge it (resolving conflicts in the
# GitHub UI or locally if any).
#
# Idempotent: does nothing (silently) if the release is already integrated or a
# sync PR for it is already open, so it won't spam PRs or emails.
#
# NOTE: scheduled workflows only run from the repository's DEFAULT branch, so
# mvp-fork-dist must stay as the fork's default branch.
name: Sync Upstream Release

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-fork-dist
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "fork-sync-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Add upstream and fetch tags
        run: |
          git remote add upstream https://github.com/zed-industries/zed.git
          # Force-update tags: the fork already carries all of upstream's tags,
          # so a plain fetch would be rejected for "would clobber existing tag".
          git fetch --quiet --force upstream 'refs/tags/*:refs/tags/*'

      - name: Determine latest upstream stable tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh api repos/zed-industries/zed/releases/latest --jq .tag_name)"
          echo "Latest upstream stable: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "branch=sync/upstream-$TAG" >> "$GITHUB_OUTPUT"

      - name: Decide whether a sync is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          BRANCH="${{ steps.tag.outputs.branch }}"
          if git merge-base --is-ancestor "refs/tags/$TAG" HEAD; then
            echo "Already integrated; nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Sync branch $BRANCH already exists (PR likely open); nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open sync PR
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          BRANCH="${{ steps.tag.outputs.branch }}"
          # Push the upstream tag as a branch and open a PR against the fork.
          # If the merge has conflicts, GitHub surfaces them on the PR for you to
          # resolve; no separate issue is created.
          git push origin "refs/tags/$TAG:refs/heads/$BRANCH"
          gh pr create --base mvp-fork-dist --head "$BRANCH" \
            --title "Sync upstream $TAG" \
            --body "Brings in upstream Zed \`$TAG\`. Review, resolve any conflicts, and merge; then cut a \`fork-v*\` tag to publish a build." \
            2>/dev/null || echo "PR for $BRANCH already exists."
