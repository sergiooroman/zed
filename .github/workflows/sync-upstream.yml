# Watches zed-industries/zed for new stable releases and, when one appears that
# the fork hasn't integrated yet, has Claude merge it and open a pull request
# for review.
#
# Earlier versions opened the PR straight from upstream's release branch. That
# needs no push, but the head then lives in a repository we don't control, so
# nobody — not GitHub's web editor, not Claude, not a maintainer — can push a
# conflict resolution to it, and every sync PR sat unresolvable. Claude runs
# with the Claude GitHub App's own token, which carries the Workflows
# permission that GITHUB_TOKEN lacks, so it can push a branch here that
# includes upstream's workflow files.
#
# NOTE: scheduled workflows only run from the repository's DEFAULT branch, so
# mvp-fork-dist must stay as the fork's default branch.
name: Sync Upstream Release

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-fork-dist
          fetch-depth: 0

      - name: Add upstream and fetch tags
        run: |
          git remote add upstream https://github.com/zed-industries/zed.git
          # Force-update tags: the fork already carries all of upstream's tags,
          # so a plain fetch would be rejected for "would clobber existing tag".
          git fetch --quiet --force upstream 'refs/tags/*:refs/tags/*'
          git fetch --quiet upstream '+refs/heads/*:refs/remotes/upstream/*'

      - name: Determine latest upstream stable release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh api repos/zed-industries/zed/releases/latest --jq .tag_name)"
          # Upstream keeps a branch per release line (v1.16.3 lives on v1.16.x).
          RELEASE_BRANCH="${TAG%.*}.x"
          echo "Latest upstream stable: $TAG (branch $RELEASE_BRANCH)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "sync_branch=sync/upstream-$TAG" >> "$GITHUB_OUTPUT"

      - name: Decide whether a sync is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if git merge-base --is-ancestor "refs/tags/$TAG" HEAD; then
            echo "Already integrated; nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          elif gh pr list --repo "$GITHUB_REPOSITORY" --state open \
                 --search "Sync upstream $TAG in:title" --json number --jq 'length' \
               | grep -qv '^0$'; then
            echo "A sync PR for $TAG is already open; nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream and open the PR
        if: steps.check.outputs.needed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 60"
          prompt: |
            Merge upstream Zed ${{ steps.tag.outputs.tag }} into this fork and open a pull
            request for a human to review. Do not push to mvp-fork-dist.

            Steps:
            1. git checkout -b ${{ steps.tag.outputs.sync_branch }}
            2. git merge --no-commit --no-ff upstream/${{ steps.tag.outputs.release_branch }}
            3. Resolve every conflict, then commit the merge.
            4. Run ./script/check-fork-customizations. It must pass.
            5. Run cargo check --workspace. It must pass. A merge can leave a file
               that never conflicted in an inconsistent state, so checking only the
               obviously affected crates is not enough: the v1.16.3 sync compiled
               cleanly that way and still failed the release build, because the
               fork's extra git panel setting no longer matched an array length
               upstream had changed in settings_ui.
            6. Push the branch and open a PR against mvp-fork-dist titled
               "Sync upstream ${{ steps.tag.outputs.tag }}".

            Read CLAUDE.md first. Its opening section is binding: this is a fork,
            and a sync must not drop any of its changes. If you cannot preserve a
            fork change while taking upstream's, stop and say so in the PR body
            rather than deciding for yourself.

            How to resolve conflicts:

            - Zed maintains each release line on its own branch, not one cumulative
              line, so this fork's older backports conflict with files it never
              customized. For any conflicted file no fork commit has ever touched,
              take upstream's side outright. Check with:
              git log --oneline HEAD --not upstream/${{ steps.tag.outputs.release_branch }} -- <file>
            - For a file the fork HAS customized, keep the fork's behaviour and
              reconcile it with upstream's changes. Never take a whole file from
              upstream without first checking what the fork added to it: a previous
              sync did exactly that and silently dropped three Windows bundling
              changes, one of which broke the release build.
            - The fork's git envelope fields live at 9000-9005 in
              crates/proto/proto/zed.proto, deliberately far above upstream's
              numbering. Leave them there, and never reuse a number upstream uses.
            - If upstream now implements something the fork had patched around,
              prefer upstream's version and delete the corresponding check from
              script/check-fork-customizations, explaining why in the commit message.

            If a conflict genuinely needs a human decision, or either check keeps
            failing, stop and open the PR anyway with the conflicts described in the
            body, clearly marked as needing a human.
