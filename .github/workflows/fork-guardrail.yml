# Fails when a sync from upstream has dropped one of the fork's own changes.
#
# Taking upstream's side of a conflicted file is often right, but it silently
# removes anything the fork had added to that same file. The v1.13.2 sync lost
# three Windows bundling changes that way and the release build was the first
# thing to notice. This runs the same marker checks on every push and pull
# request so a dropped change fails in seconds instead of at build time.
name: Fork Guardrail

on:
  push:
    branches: [mvp-fork-dist]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customizations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the fork's customizations survived
        run: ./script/check-fork-customizations

  compiles:
    # Only on pull requests: this is what validates a sync merge, and the agent
    # that prepares one cannot compile within a single run. A merge can leave a
    # file that never conflicted in an inconsistent state, so check the whole
    # workspace rather than the crates that happened to conflict — the v1.16.3
    # sync passed a partial check and still failed the release build.
    if: github.event_name == 'pull_request'
    name: Workspace compiles
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: fork-guardrail-linux
          cache-on-failure: true
      - name: cargo check --workspace
        run: cargo check --workspace --all-targets
