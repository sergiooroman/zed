# Fork release workflow — builds unsigned macOS (arm64) and Windows (x64)
# artifacts and attaches them to a GitHub Release on the fork.
#
# Trigger by pushing a tag like `fork-v1.0.0`, or manually via the Actions tab.
# The landing page / VPS links to the resulting release assets.
name: Fork Release

on:
  push:
    tags:
      - "fork-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. fork-v1.0.0)"
        required: true

permissions:
  contents: write

env:
  # Resolve the tag from either the push ref or the manual input.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  macos:
    name: Build macOS (arm64)
    # macos-15 for the SDK: on macos-14 (Xcode 15.4, MacOSX14.5) webrtc-sys fails
    # to compile because that libc++ cannot instantiate cxx's
    # rust::Slice<...>::iterator, which is why this job used to be disabled and
    # the .dmg built by hand. Newer SDKs compile it — a local Xcode 26 does.
    # Set ENABLE_MAC_CI=false to fall back to building the .dmg locally.
    if: ${{ vars.ENABLE_MAC_CI != 'false' }}
    runs-on: macos-15
    # Bash generate-licenses: setting this drops --fail and the strict
    # fail-on-stderr wrapper, so benign cargo warnings don't fail the build.
    # (The Windows PowerShell variant inverts this flag, so it stays unset there.)
    env:
      ALLOW_MISSING_LICENSES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show # honors rust-toolchain.toml

      - name: Add aarch64 target
        run: rustup target add aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: fork-macos-arm64
          cache-on-failure: true

      - name: Set fork version from tag
        # Same as the Windows job: the auto-updater compares the version baked
        # into the binary against the manifest, so a .dmg built without this
        # ships the working tree's version and never looks like an update.
        run: |
          version="${RELEASE_TAG#fork-v}"
          perl -0pi -e "s/^version = \"[^\"]*\"/version = \"$version\"/m" crates/zed/Cargo.toml
          echo "zed crate version set to $version"

      - name: Build unsigned .dmg
        # No signing env vars set -> the script skips signing/notarization.
        # GitHub macOS runners ship Xcode, so shaders are precompiled; we do
        # not need the runtime_shaders fallback here.
        run: ./script/bundle-mac aarch64-apple-darwin

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/Zed-aarch64.dmg "dist/ZedFork-macos-arm64.dmg"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "Fork build" --draft --clobber || true
          gh release upload "$RELEASE_TAG" dist/ZedFork-macos-arm64.dmg --clobber

  windows:
    name: Build Windows (x64)
    # Pinned to 2022: it ships Inno Setup with iscc in PATH; the bundle script
    # assumes that layout. (Windows 2025 runners differ — see the script's notes.)
    runs-on: windows-2022
    # Use the git CLI for fetching so core.longpaths applies — some git deps
    # (e.g. the `pet` test fixtures) exceed Windows' 260-char path limit.
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -Type DWord

      - name: Install Rust toolchain
        run: rustup show

      - name: Add x86_64 target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Cache Rust build
        # Caches the cargo registry, git deps, and dependency build artifacts so
        # subsequent builds (e.g. after an upstream sync) don't recompile the
        # heavy C++ deps like webrtc from scratch.
        uses: Swatinem/rust-cache@v2
        with:
          key: fork-windows-x64
          cache-on-failure: true

      - name: Prefetch dependencies
        # Populate the cargo git cache up front so cargo-about's `cargo metadata`
        # (run during license generation) doesn't fail resolving git deps.
        shell: pwsh
        run: cargo fetch --target x86_64-pc-windows-msvc

      - name: Set fork version from tag
        # Embed the release version (fork-vX.Y.Z -> X.Y.Z) into the binary so the
        # auto-updater can compare it against the manifest. Tag each release with
        # a version higher than the last (and >= the upstream base).
        shell: pwsh
        run: |
          $v = "$env:RELEASE_TAG" -replace '^fork-v', ''
          $p = 'crates/zed/Cargo.toml'
          $c = Get-Content $p -Raw
          $c = $c -replace '(?m)^version = "[^"]*"', "version = `"$v`""
          Set-Content $p $c -NoNewline
          Write-Host "zed crate version set to $v"

      - name: Build unsigned .exe installer
        # No Azure signing secrets set -> the script skips signing.
        shell: pwsh
        run: ./script/bundle-windows.ps1 -Architecture x86_64

      - name: Rename artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/Zed-x86_64.exe dist/ZedFork-windows-x64.exe

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # `gh release create` has no --clobber flag and errors if the release
          # already exists (e.g. a re-run, or the mac job created it first), so
          # only create it when missing, then upload the installer replacing any
          # previous asset. This keeps the step idempotent across re-runs.
          gh release view "$env:RELEASE_TAG" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --title "$env:RELEASE_TAG" --notes "Fork build" --draft
          }
          gh release upload "$env:RELEASE_TAG" dist/ZedFork-windows-x64.exe --clobber
