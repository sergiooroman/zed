# Lets Claude act on this repository when someone mentions @claude in an issue
# or pull request comment. Requires a CLAUDE_CODE_OAUTH_TOKEN secret (generate
# one with `claude setup-token`) or an ANTHROPIC_API_KEY, plus the Claude GitHub
# App installed on the repository.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.review.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # A merge needs the full history of both sides, not a shallow clone.
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 40"
